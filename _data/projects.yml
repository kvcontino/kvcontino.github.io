# Projects index. Rendered by _pages/presentations.html.
#
# Order here is display order, newest first. Nothing sorts this file, so a new
# entry goes where it belongs by hand.
#
# `mark` names a drawing in _includes/project-mark.html. It is deliberately a
# key and not a filename, so a form can be shared: two projects that ARE the
# same kind of thing get the same mark. Adding a project with no new form means
# reusing a key and drawing nothing. The valid keys are listed at the top of
# that include; an unrecognised one renders no mark rather than failing loudly,
# so check the page after adding one.
#
# `blurb` is one sentence, plain text, no markup. Keep it to what the thing IS.

