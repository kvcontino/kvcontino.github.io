# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Kevin V. Contino
email: kvcontino [at] gmail
# This is the single source for three things that are easy to forget are linked:
# jekyll-seo-tag builds the home page's <title> as "{{ site.title }} | {{ site.
# description }}", which is the line Google prints as the search result; it also
# fills <meta name="description"> and og:description; and jekyll-feed uses it as
# the RSS channel description. Change it here and all four move together.
# It reads as a subtitle after the name, so it is a noun phrase, not a sentence
# about the site.
description: > # greater_than means to ignore newlines until "baseurl:"
  Health care, geography, and demographics
baseurl: ""
url: "https://kvcontino.github.io"

# Google Search Console ownership. Emitted into every page's <head> by
# jekyll-seo-tag. There is a second, older verification tag hardcoded in
# _layouts/default.html from the 2017 Jekyll conversion; it belongs to a
# different Google account and no property uses it. Two tags are legal —
# Google matches the one it issued — so it is left alone deliberately.
# DNS verification is impossible here: github.io is GitHub's zone, so a
# URL-prefix property with this meta tag is the only route.
webmaster_verifications:
  google: j53lhmpgyzQf9kDTbMxDsIg23dmfz7M8TlyVGGaTmYA

# timezone 
timezone: America/New_York

# kramdown
kramdown:
  input: GFM
  
# Build settings
markdown: kramdown

# No `theme:` on purpose. Every page here uses _layouts/default.html, so a
# gem theme contributes nothing but its stylesheet. The github-pages gem
# always resolves SOME theme and its default publishes a 136 KB
# assets/css/style.css that no page here links; `exclude` cannot suppress it
# because theme files are injected rather than sourced. The empty
# assets/css/style.scss in this repo overrides it — that is the only reason
# that file exists. (`theme: minima` published 18 KB of the same dead weight.)
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
exclude:
  - Gemfile
  - Gemfile.lock
  # Workflow notes for me, not for readers. A .md without front matter is
  # copied verbatim into _site and would otherwise be served at its own URL.
  - PUBLISHING.md
  - script

include:
- _stylesheets
- _pages
- _images
- _resources

# Open Graph share card. When a url is pasted into Slack, Signal, iMessage,
# Discord, LinkedIn or Mastodon, the app fetches the page and looks for
# <meta property="og:image"> to build a preview. With none it shows a bare link.
#
# This has to be `defaults:` and not a top-level `image:` key. jekyll-seo-tag
# reads `page["image"]` and has NO site-level fallback, so a top-level key would
# sit here doing nothing at all — an entirely silent no-op. Front-matter
# defaults do populate `page`, so seo-tag sees them, and any page can override
# by declaring its own `image:`. Project pages do exactly that.
#
# The cards are generated by `script/build-og-cards.py` from the marks and
# blurbs the site already uses; re-run it after changing either.
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/og/site.png
        width: 2400
        height: 1260
        alt: "Kevin V. Contino — health care, geography, and demographics"
