<style>
  /* Themed to kvcontino.github.io (2026-08-29): black ground, warm apparatus,
     one red, square corners, no shadows. The tokens below are copied from the
     site's lite.css rather than imported, because this page is deliberately
     self-contained and must still open from file:// with no server.

     The font is loaded by absolute path for the same reason: served from the
     site it resolves and the map matches the page around it; opened straight
     off disk it simply fails and falls back to Georgia, which is the stack the
     site itself falls back to. A relative path would have inverted that. */
  @font-face{font-family:'Sorts Mill Goudy';
    src:url('/assets/fonts/SortsMillGoudy-Regular.woff2') format('woff2');
    font-weight:400;font-style:normal;font-display:swap}
  :root{
    --void:#000; --ink:#e8e8e8; --ink-2:#cbb8a9; --ink-faint:#4a4038;
    --bleed:#b81419; --ember:#e04a42; --track:0.14em;
    --serif:'Sorts Mill Goudy','Iowan Old Style',Georgia,serif;
  }
  html,body,#map{height:100%;margin:0}
  #map{background:var(--void)}
  /* Square, unshadowed, hairline-ruled: the site uses no rounded corners and no
     drop shadows anywhere, and a floating card would read as a different site. */
  .panel{position:absolute;z-index:1000;background:var(--void);padding:11px 13px;
    border:1px solid var(--ink-faint);border-radius:0;box-shadow:none;
    color:var(--ink-2);font:14px/1.5 var(--serif)}
  #title{top:10px;left:52px;max-width:340px} #legend{bottom:20px;right:10px}
  /* Tracked caps, the site's one tracking token, and it is only ever on caps. */
  #title h1{font-size:13px;margin:0 0 6px;color:var(--ink);font-weight:400;
    text-transform:uppercase;letter-spacing:var(--track)}
  #title p{margin:0 0 8px;color:var(--ink-2)}
  .lg-row{display:flex;align-items:center;gap:7px;margin:3px 0}
  .sw{width:16px;height:12px;display:inline-block;border:1px solid var(--ink-faint)}
  .modebar{display:flex;gap:14px;margin:8px 0 2px}
  .modebar label{cursor:pointer;color:var(--ink)}
  .modebar input{accent-color:var(--ember)}
  #sel{color:var(--ember);margin:0}
  #legend b{color:var(--ink);font-weight:400;
    text-transform:uppercase;letter-spacing:var(--track);font-size:11px}
  /* Labels sit on the dark ground, so the halo that keeps them legible has to
     be the ground colour, not white. */
  .placelabel,.stlabel{font:12px/1.3 var(--serif);background:none;border:none;
    box-shadow:none;white-space:nowrap;
    text-shadow:0 0 3px var(--void),0 0 3px var(--void),0 0 6px var(--void)}
  .placelabel{color:var(--ink-2)}
  .stlabel{color:var(--ink)}
  /* Leaflet's own chrome is light by default and would be the one bright thing
     on the page. */
  .leaflet-container{background:var(--void)}
  .leaflet-control-zoom a{background:var(--void);color:var(--ink-2);
    border:1px solid var(--ink-faint);border-radius:0}
  .leaflet-control-zoom a:hover{color:var(--ember);border-color:var(--ember)}
  /* `.leaflet-container .leaflet-control-attribution` (0-2-0) sets the white,
     so a bare class selector here loses however late it is declared. Matching
     the same two classes wins on source order. */
  .leaflet-container .leaflet-control-attribution{background:rgba(0,0,0,.72);
    color:var(--ink-faint);font:11px/1.4 var(--serif)}
  .leaflet-control-attribution a{color:var(--ink-2)}
  /* The Leaflet credit ships a small multicolour flag icon, and on a black map
     it is the brightest thing on the page. Leaflet sets `display:inline
     !important` on it specifically so it cannot be hidden -- that is their
     call and it is not ours to override, so this desaturates rather than
     removes: the flag is still there, still linked, just no longer the loudest
     object on a dark map. Filter needs no !important because it is not
     competing with anything. */
  .leaflet-attribution-flag{filter:grayscale(1) opacity(0.5)}
  /* Station tooltips. Leaflet's default is a white rounded card with a drop
     shadow and a matching arrow drawn from border colours on a :before -- the
     one bright object left on the map once everything else went dark. The
     arrow has to be recoloured for each of the four directions or it stays
     white and floats detached from the box it belongs to. */
  .leaflet-tooltip{background:var(--void);border:1px solid var(--ink-faint);
    border-radius:0;box-shadow:none;color:var(--ink);
    font:13px/1.3 var(--serif);padding:4px 8px}
  .leaflet-tooltip-top:before{border-top-color:var(--ink-faint)}
  .leaflet-tooltip-bottom:before{border-bottom-color:var(--ink-faint)}
  .leaflet-tooltip-left:before{border-left-color:var(--ink-faint)}
  .leaflet-tooltip-right:before{border-right-color:var(--ink-faint)}
  .lg-foot{margin-top:6px;color:var(--ink-faint)}

  /* --- Docked legend, for the embedded (not expanded) case ----------------
     Floating panels are right when the map has the whole viewport: they sit
     over dead space at the edges. Inside the page's 4:3 embed there is no dead
     space, and the legend covered a quarter of Northern Virginia -- including
     Alexandria and the whole southern half of the Blue Line.

     So when the map knows it is embedded, body becomes a flex row and the
     legend leaves the map canvas entirely: no overlap, and the map keeps every
     pixel it still has. Expanding puts it back to floating, which is what the
     extra room is for.

     Default is UNDOCKED. A map opened on its own -- /map/ directly, or from
     file:// -- has the window to itself and should float, and that is also the
     state this file had before the page existed. Docking is the exception the
     embed asks for, not the new normal.

     The title panel stays floating either way: it is small, it sits in the
     top-left where the data bbox has margin anyway, and it carries the mode
     toggle, which wants to be over the map rather than beside it. */
  body.docked{display:flex;align-items:stretch}
  body.docked #map{flex:1 1 auto;height:100%;min-width:0}
  body.docked #legend{position:static;flex:0 0 auto;width:172px;
    border:0;border-left:1px solid var(--ink-faint);
    /* Top padding clears the page's "Full screen" button, which the PARENT
       positions over this corner of the embed. Only the docked case needs it:
       when expanded the legend floats bottom-right and the button is nowhere
       near it. */
    padding:46px 14px 12px;overflow-y:auto}

const map = L.map('map', {center: [38.89158633333333, -77.19956599999999], zoom: 11});

map.createPane('ctx');      map.getPane('ctx').style.zIndex = 350;
map.createPane('roadsTop'); map.getPane('roadsTop').style.zIndex = 450;
map.createPane('iso');      map.getPane('iso').style.zIndex = 470;
map.createPane('labels');   map.getPane('labels').style.zIndex = 600;
map.createPane('stations'); map.getPane('stations').style.zIndex = 620;
const stationRenderer = L.svg({pane:'stations'});
const isoRenderer = L.svg({pane:'iso'});

function gj(feats, style, pane){ return L.geoJSON({type:'FeatureCollection',features:feats||[]},
  {style:style, pane:pane, interactive:false}); }

gj(C.water, {weight:0, fillColor:'#16232b', fillOpacity:1}, 'ctx').addTo(map);
gj(C.roads_secondary, {color:'#3a332c', weight:0.7}, 'ctx').addTo(map);
gj(C.places, {color:'#4a4038', weight:0.6, dashArray:'2,3', fill:false}, 'ctx').addTo(map);
gj(C.counties, {color:'#5f5449', weight:1.3, fill:false}, 'ctx').addTo(map);
gj(C.roads_primary, {color:'#cbb8a9', weight:1.6, opacity:0.85}, 'roadsTop').addTo(map);
(C.labels||[]).forEach(l => L.marker([l.lat,l.lng], {pane:'labels', interactive:false,
  icon:L.divIcon({className:'placelabel', html:l.name, iconSize:null})}).addTo(map));

let mode = 'walk', curId = null, ovl = null, isoLayer = null;
const markers = {};

function draw(){
  const s = STATIONS.find(x => x.station_id === curId);
  if(!s) return;
  const m = s.modes[mode] || s.modes.walk;
  if(ovl) map.removeLayer(ovl);
  ovl = L.imageOverlay(m.png, m.bounds, {opacity:0.65}).addTo(map);
  if(isoLayer) map.removeLayer(isoLayer);
  isoLayer = L.geoJSON((ISO[mode]||{})[s.station_id], {pane:'iso', renderer:isoRenderer,
    interactive:false, style:f => ({color:'#333', weight:f.properties.min<=30?1.4:1.0,
      opacity:0.75, dashArray: f.properties.min%30===0?null:'4,3'})}).addTo(map);
  const label = mode==='mm' ? 'walk + Metro' : 'walk';
  document.getElementById('sel').innerHTML = 'Showing '+label+' time <b>from '+s.name+'</b>';
  Object.entries(markers).forEach(([id,mk]) =>
    mk.setStyle({fillColor:id===curId?'#e04a42':'#000', color:id===curId?'#b81419':'#cbb8a9'}));
}
function select(s){ curId = s.station_id; draw(); }

STATIONS.forEach(s => {
  const mk = L.circleMarker([s.lat,s.lng], {renderer:stationRenderer, pane:'stations',
    radius:6, weight:1.6, color:'#cbb8a9', fillColor:'#000', fillOpacity:1}).addTo(map);
  mk.bindTooltip(s.name); mk.on('click', () => select(s));
  markers[s.station_id] = mk;
});

document.querySelectorAll('input[name=mode]').forEach(r => r.addEventListener('change', e => {
  mode = e.target.value; draw(); }));
if(!HAVE_MM){ document.getElementById('mmlabel').style.opacity=0.4;
  document.querySelector('input[value=mm]').disabled=true; }

map.fitBounds(L.latLngBounds(STATIONS.map(s=>[s.lat,s.lng])).pad(0.08));
if(STATIONS.length) select(STATIONS[0]);

// --- Dock the legend when embedded, float it when expanded ----------------
// Two signals, because neither alone is enough:
//
//   embedded?   window.self !== window.top. Cheap, same-origin-safe, and true
//               for the page's iframe and false for /map/ opened directly.
//   expanded?   the parent owns the Fullscreen API here -- it calls
//               requestFullscreen() on the wrapper DIV, not on the iframe, so
//               `document.fullscreenElement` inside THIS document stays null
//               the whole time. The map cannot detect the change on its own;
//               the parent posts it. Falling back to a size heuristic was
//               tried in the head and rejected: it guesses, and it guesses
//               wrong on a small laptop in fullscreen.
(function () {
  var embedded = false;
  try { embedded = window.self !== window.top; } catch (e) { embedded = true; }
  if (!embedded) return;                    // standalone: leave it floating
  document.body.classList.add('docked');
  window.addEventListener('message', function (ev) {
    // Same-origin only, and only the one message this page understands.
    if (ev.origin !== window.location.origin) return;
    if (!ev.data || ev.data.type !== 'walksheds:fullscreen') return;
    document.body.classList.toggle('docked', !ev.data.on);
    // Leaflet sizes its panes from the container; the flex change resizes it
    // without a window resize event, so it has to be told.
    // `const map = L.map(...)` is a top-level const, which does NOT become a
    // property of window -- `window.map` is undefined here even though the
    // binding is in scope. Testing window.map would have silently skipped the
    // resize forever, leaving Leaflet's panes sized for the old box.
    if (typeof map !== 'undefined' && map.invalidateSize) {
      setTimeout(function () { map.invalidateSize(); }, 60);
    }
  });
}());
</script></body></html>
